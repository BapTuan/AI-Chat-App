<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Chat - Gemini 2.5 Flash</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="chat-header">
      <h1>AI Chat</h1>
      <p>Ask about text, images, or CSV data</p>
    </div>

    <div id="chat-messages" class="chat-messages"></div>

    <div class="input-area">
      <div class="upload-area">
            <label for="imageInput" class="upload-btn">📷 Image</label>
            <input type="file" id="imageInput" accept="image/*" style="display:none" />

            <label for="csvFileInput" class="upload-btn">📊 CSV File</label>
            <input type="file" id="csvFileInput" accept=".csv" style="display:none" />

            <input type="url" id="csvURL" placeholder="Or paste CSV URL..." />
        </div>  

      <div class="message-input">
        <textarea id="userInput" placeholder="Ask anything..."></textarea>
        <button id="sendBtn">Send</button>
      </div>
      <div id="loading" class="loading" style="display:none">Thinking...</div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
